services:
    user-service:
        image: jitendra511/user-service:v1
        container_name: user-service
        ports:
            - "8086:8086"
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tmuser
            - SPRING_DATASOURCE_USERNAME=root
            - SPRING_DATASOURCE_PASSWORD=Jitendra
    
    order-service:
        image: jitendra511/order-service:v1
        container_name: order-service
        ports:
            - "8081:8081"
        depends_on:
            mysql:
                condition: service_healthy
            kafka:
                condition: service_started
        environment:
            - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tmorder
            - SPRING_DATASOURCE_USERNAME=root
            - SPRING_DATASOURCE_PASSWORD=Jitendra
            - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

    payment-service:
        image: jitendra511/payment-service:v1
        container_name: payment-service
        ports:
            - "8082:8082"
        depends_on:
            mysql:
                condition: service_healthy
            kafka:
                condition: service_started
        environment:
            - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tmpayment
            - SPRING_DATASOURCE_USERNAME=root
            - SPRING_DATASOURCE_PASSWORD=Jitendra
            - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

    stock-service:
        image: jitendra511/stock-service:v1
        container_name: stock-service
        ports:
            - "8083:8083"
        depends_on:
            mysql:
                condition: service_healthy
            kafka:
                condition: service_started
        environment:
            - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tmstock
            - SPRING_DATASOURCE_USERNAME=root
            - SPRING_DATASOURCE_PASSWORD=Jitendra
            - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

    delivery-service:
        image: jitendra511/delivery-service:v1
        container_name: delivery-service
        ports:
            - "8084:8084"
        depends_on:
            mysql:
                condition: service_healthy
            kafka:
                condition: service_started
        environment:
            - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tmdelivery
            - SPRING_DATASOURCE_USERNAME=root
            - SPRING_DATASOURCE_PASSWORD=Jitendra
            - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092


    mysql:
        image: mysql:8
        container_name: mysql-container
        ports:
            - "3307:3306"
        environment:
            MYSQL_ROOT_PASSWORD: Jitendra
        restart: always
        volumes:
            - mysql-volume:/var/lib/mysql
            - ./mysql-init:/docker-entrypoint-initdb.d
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 30s
            retries: 5
            start_period: 30s

    zookeeper:
        image: confluentinc/cp-zookeeper:7.4.0
        container_name: zookeeper
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
        ports:
            - "2181:2181"

    kafka:
        image: confluentinc/cp-kafka:7.4.0
        container_name: kafka
        depends_on:
            - zookeeper
        ports:
            - "9092:9092"
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
    mysql-volume:


        